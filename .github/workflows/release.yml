name: Release

# A release is prepared as a DRAFT by Scripts/draft-release.ps1 (notes from
# CHANGELOG.md, per-engine prebuilt ZIPs and SHA256SUMS attached). Publishing
# that draft creates the tag; this workflow then adds a source ZIP built from
# the tagged tree with git archive, so .git/Binaries/Intermediate/Saved and
# untracked dev files are excluded.
on:
  release:
    types: [published]

jobs:
  source-zip:
    name: Attach source ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Zip plugin source for non-git install
        run: git archive --format=zip --prefix=HapbeatSDK/ -o HapbeatSDK-${{ github.event.release.tag_name }}-source.zip HEAD

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} HapbeatSDK-${{ github.event.release.tag_name }}-source.zip --clobber
